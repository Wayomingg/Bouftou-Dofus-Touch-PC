<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 21">
  <!-- Drapeau de la langue espagnole (barre de gauche, menu de langue) : bandes rouge, jaune, rouge (1:2:1), sans écusson à cette taille ; liseré brun et reflet comme les icônes du jeu. -->
  <defs>
    <clipPath id="c"><rect x="1" y="1" width="28" height="19" rx="3"/></clipPath>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect x="1" y="1" width="28" height="19" fill="#c3222b"/>
    <rect x="1" y="5.75" width="28" height="9.5" fill="#f5c400"/>
    <rect x="1" y="1" width="28" height="19" fill="url(#r)"/>
  </g>
  <rect x="1" y="1" width="28" height="19" rx="3" fill="none" stroke="#2a2016" stroke-width="1.6"/>
</svg>
