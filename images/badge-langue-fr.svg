<svg xmlns="http://www.w3.org/2000/svg" width="220" height="28" viewBox="0 0 220 28" role="img" aria-labelledby="titre">
  <title id="titre">Présentation française</title>
  <rect width="220" height="28" rx="3" fill="#30363d"/>
  <svg x="8" y="4" width="28" height="20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 21">
  <!-- Drapeau de la langue française (barre de gauche, menu de langue) : liseré brun et reflet comme les icônes du jeu. -->
  <defs>
    <clipPath id="c"><rect x="1" y="1" width="28" height="19" rx="3"/></clipPath>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect x="1" y="1" width="9.4" height="19" fill="#1f4fa8"/>
    <rect x="10.3" y="1" width="9.4" height="19" fill="#f4efe3"/>
    <rect x="19.6" y="1" width="9.4" height="19" fill="#d8383f"/>
    <rect x="1" y="1" width="28" height="19" fill="url(#r)"/>
  </g>
  <rect x="1" y="1" width="28" height="19" rx="3" fill="none" stroke="#2a2016" stroke-width="1.6"/>
</svg>
  <text x="44" y="18" fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" font-weight="bold">Présentation française</text>
</svg>
